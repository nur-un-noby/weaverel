<form 
    hx-post="{% url 'wishlist:toggle_wishlist' product_id=product.id %}" 
    hx-swap="outerHTML" 
    class="inline-block"
>
    {% csrf_token %}
    <button 
        type="submit" 
        class="w-8 h-8 rounded-full bg-white/90 backdrop-blur-xs flex items-center justify-center shadow-md transition hover:scale-110 {% if is_in_wishlist %}text-rose-600{% else %}text-stone-700 hover:text-rose-600{% endif %}" 
        title="{% if is_in_wishlist %}Remove from Wishlist{% else %}Add to Wishlist{% endif %}"
    >
        <svg class="w-4 h-4 {% if is_in_wishlist %}fill-current{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
        </svg>
    </button>
</form>
