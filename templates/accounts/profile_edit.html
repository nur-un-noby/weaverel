{% extends 'base.html' %}
{% load static i18n %}

{% block title %}প্রোফাইল পরিবর্তন | {{ site_config.site_name|default:'Weaverel' }}{% endblock %}

{% block content %}
<div class="w-full px-4 sm:px-8 lg:px-12 2xl:px-16 py-10 max-w-xl mx-auto">
    <div class="bg-white p-8 rounded-3xl border border-stone-200 shadow-xs space-y-6">
        <div>
            <h1 class="text-2xl font-black font-serif-title text-stone-900">প্রোফাইল তথ্য পরিবর্তন</h1>
            <p class="text-xs text-stone-500 mt-1">আপনার নাম, মোবাইল নম্বর এবং যোগাযোগের ঠিকানা আপডেট করুন</p>
        </div>

        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block font-bold text-stone-700 mb-1">প্রথম অংশ:</label>
                    <input type="text" name="first_name" required value="{{ form.first_name.value|default:'' }}" class="w-full p-3 rounded-xl border border-stone-300">
                </div>
                <div>
                    <label class="block font-bold text-stone-700 mb-1">শেষ অংশ:</label>
                    <input type="text" name="last_name" required value="{{ form.last_name.value|default:'' }}" class="w-full p-3 rounded-xl border border-stone-300">
                </div>
            </div>

            <div>
                <label class="block font-bold text-stone-700 mb-1">ইমেইল:</label>
                <input type="email" name="email" required value="{{ form.email.value|default:'' }}" class="w-full p-3 rounded-xl border border-stone-300">
            </div>

            <div>
                <label class="block font-bold text-stone-700 mb-1">মোবাইল নম্বর:</label>
                <input type="tel" name="phone_number" value="{{ form.phone_number.value|default:'' }}" class="w-full p-3 rounded-xl border border-stone-300">
            </div>

            <div>
                <label class="block font-bold text-stone-700 mb-1">বিকল্প মোবাইল নম্বর:</label>
                <input type="tel" name="alternative_phone" value="{{ form.alternative_phone.value|default:'' }}" class="w-full p-3 rounded-xl border border-stone-300">
            </div>

            <div>
                <label class="block font-bold text-stone-700 mb-1">জেলা (District / ৬৪ জেলা):</label>
                <select name="district" class="w-full p-3 rounded-xl border border-stone-300 font-medium focus:ring-1 focus:ring-stone-900 focus:outline-none">
                    {% for div in bangladesh_divisions %}
                        <optgroup label="{{ div.division_bn }} ({{ div.division_en }} Division)">
                            {% for code, label in div.districts %}
                                <option value="{{ code }}" {% if form.district.value == code or not form.district.value and code == 'Dhaka' or form.district.value == 'Chittagong' and code == 'Chattogram' %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </optgroup>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block font-bold text-stone-700 mb-1">ডিফল্ট ঠিকানা:</label>
                <textarea name="address" rows="2" class="w-full p-3 rounded-xl border border-stone-300">{{ form.address.value|default:'' }}</textarea>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button type="submit" class="px-6 py-3 bg-stone-900 text-white font-bold rounded-xl hover:bg-stone-800 transition">
                    সংরক্ষণ করুন (Save Changes)
                </button>
                <a href="{% url 'accounts:dashboard' %}" class="px-5 py-3 bg-stone-100 text-stone-700 font-bold rounded-xl hover:bg-stone-200 transition">
                    বাতিল
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
